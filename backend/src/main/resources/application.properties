server.port=8001

# PostgreSQL (source of truth) — Mac data stack runs on host port 5435
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5435}/${PGDATABASE:ecommerce}
spring.datasource.username=${PGUSER:ecommerce}
spring.datasource.password=${PGPASSWORD:ecommerce}
spring.datasource.hikari.maximum-pool-size=10

# MongoDB (product catalog)
spring.data.mongodb.uri=mongodb://${MONGOHOST:localhost}:${MONGOPORT:27017}/${MONGODB:ecommerce}

# Elasticsearch (admin search / read model)
app.es.url=http://${ESHOST:localhost}:${ESPORT:9200}
app.es.index=${ESINDEX:orders}

# Sync strategy: dual_write | polling
app.sync.strategy=${SYNC_STRATEGY:dual_write}
app.poll.interval-seconds=15
